<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Evidencias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">
        Sistema de Actividades
    </a>
</nav>
    
<div class="container mt-5">
    <h2>Agregar Evidencias</h2>
    <form th:action="@{/alumno/guardarEvidencias}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${actividad.id}">
            <div class="form-group">
                <label>Selecciona imágenes</label>
                <input type="file" name="archivos" multiple class="form-control">
            </div>

        <button type="submit" class="btn btn-success">
            Guardar Evidencias
        </button>

        <a th:href="@{/alumno/misActividades}" class="btn btn-secondary">
            Regresar
        </a>

    </form>
</div>
</body>

</html>
