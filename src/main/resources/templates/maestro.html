<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Maestro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">
        Sistema de Actividades
    </a>
</nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h3>Login Maestro</h3>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/loginMaestro}" method="post">
                            <div class="form-group">
                                <label>Usuario</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>Contraseña</label>
                                <input type="password" name="password" class="form-control" placeholder="Ingrese contraseña" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block">
                                Iniciar Sesión
                            </button>

                        </form>
                        <div th:if="${param.error}" class="alert alert-danger mt-3">
                            Usuario o contraseña incorrectos
                        </div>

                        <div class="mt-3 text-center">
                            <a th:href="@{/}">
                                Regresar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white text-center p-3 mt-5">

    Powered by:
    Spring Boot,
    Spring Security,
    Thymeleaf,
    Bootstrap 4,
    MySQL

</footer>
</body>

</html>
