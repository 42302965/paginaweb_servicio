<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis Actividades</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">
        Sistema de Actividades
    </a>
    <div class="ml-auto">
        <a th:href="@{/alumno/inicioAlumno}" class="btn btn-outline-light mr-2">
            Inicio
        </a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger">
                Cerrar Sesión
            </button>
        </form>
    </div>
</nav>
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>Mis Actividades</h2>
        <a th:href="@{/alumno/inicioAlumno}" class="btn btn-secondary">
            Regresar
        </a>

    </div>
    <a th:href="@{/alumno/nuevaActividad}" class="btn btn-success mb-3">
        Nueva Actividad
    </a>

    <table class="table table-bordered bg-white">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Categoría</th>
                <th>Horas</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Evidencias</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="actividad : ${listaActividades}">
                <td th:text="${actividad.id}"></td>
                <td th:text="${actividad.descripcion}"></td>
                <td th:text="${actividad.categoria != null ? actividad.categoria.nombre : 'Sin categoría'}"></td>
                <td th:text="${actividad.horas}"></td>
                <td th:text="${#temporals.format(actividad.fechaInicio, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(actividad.fechaFin, 'dd/MM/yyyy')}"></td>
                <td>
                    <a th:href="@{/alumno/verEvidencias(id=${actividad.id})}" class="btn btn-info btn-sm">
                        Ver Evidencias
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
