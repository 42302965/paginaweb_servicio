<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Alumno</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">
        Sistema de Actividades
    </a>
</nav>
<div class="container mt-5">
    <h2>Nuevo Alumno</h2>
    <form th:action="@{/maestro/guardarAlumno}" th:object="${alumno}" method="post">
        <div class="form-group">
            <label>Matrícula</label>
            <input type="text" th:field="*{matricula}" class="form-control"required>
        </div>

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"required>
        </div>

        <div class="form-group">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" class="form-control"required>
        </div>

        <div class="form-group">
            <label>Login</label>
            <input type="text" th:field="*{login}" class="form-control"required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" th:field="*{contrasena}" class="form-control"required>

        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/maestro/listaAlumnos}" class="btn btn-secondary">
            Regresar
        </a>
    </form>
</div>
</body>
</html>
