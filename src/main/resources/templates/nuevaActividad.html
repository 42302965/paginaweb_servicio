<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Nueva actividad</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    </head>
    
    <body class="bg-light">
        <div class="container mt-5">
            <div class="card shadow">
                <div class="card-header">
                    <h3>Nueva Actividad</h3>
                </div>
                
                <div class="card-body">
                    <form th:action="@{/guardarActividad}" th:object="${actividad}" method="post">
                
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Horas</label>
                            <input type="number" th:field="*{horas}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Fecha Inicio</label>
                            <input type="date" th:field="*{fechaInicio}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Fecha Fin</label>
                            <input type="date" th:field="*{fechaFin}" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Categoría</label>
                            <select th:field="*{categoria}" class="form-control">
                                <option th:each="cat : ${listaCategorias}" th:value="${cat.num}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">Guardar</button>

                        <a th:href="@{/misActividades}"class="btn btn-secondary">Regresar</a>
                    </form>
                </div>
            </div>
        </div>
</body>
</html>
