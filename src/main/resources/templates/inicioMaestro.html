<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio Maestro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/inicioUsuarios.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">
        Sistema de Actividades
    </a>
    <div class="ml-auto">
        <a th:href="@{/maestro/inicioMaestro}" class="btn btn-outline-light mr-2">
            Inicio
        </a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger">
                Cerrar Sesión
            </button>
        </form>
    </div>
</nav>
    <div class="panel">
        <h2 class="titulo">
            Bienvenido Maestro
        </h2>
        <p class="subtitulo">
            Panel principal del sistema
        </p>
        <a th:href="@{/maestro/listaAlumnos}" class="btn btn-primary btn-custom">
            Administrar Alumnos
        </a>
        <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-secondary btn-custom">
            Cerrar Sesión
        </button>
    </form>
    </div>
</body>
</html>
